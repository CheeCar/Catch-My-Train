# XcodeGen config: CatchMyTrain.xcodeproj is generated from it (the folder already includes the generated project).
# After generating, run tools/fix-product-names.sh: XcodeGen names product files after the targets, but the app and widget files are "Catch My Train".
# Rerun `xcodegen generate` only after changing this file or adding/removing source files (install: brew install xcodegen).
name: CatchMyTrain

options:
  bundleIdPrefix: com.cheecar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# The Developer Team isn't kept in the repository: Signing.xcconfig reads it from Local.xcconfig (ignored by git).
# Copy Local.xcconfig.example to Local.xcconfig and put your Team ID there.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Apple silicon only (no Intel support)
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO

packages:
  CatchCore:
    path: Packages/CatchCore

targets:
  CatchMyTrain:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: CatchCore
        product: TransitCore
      - package: CatchCore
        product: CatchText
      - target: CatchMyTrainWidgetExtension
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Catch My Train
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "278"
        LSApplicationCategoryType: public.app-category.travel
        NSHumanReadableCopyright: Copyright (c) 2026 CheeCar. PolyForm Noncommercial License 1.0.0.
        NSLocationUsageDescription: Catch My Train uses your location to work out walking times to nearby stations, stops and piers. It is sent only to Apple Maps, for walking routes and place names, and to no one else, unless you choose Google Maps for Directions.
        NSLocationWhenInUseUsageDescription: Catch My Train uses your location to work out walking times to nearby stations, stops and piers. It is sent only to Apple Maps, for walking routes and place names, and to no one else, unless you choose Google Maps for Directions.
        AppGroupIdentifier: $(TeamIdentifierPrefix)com.cheecar.catchmytrain.shared
        CFBundleURLTypes:
          - CFBundleURLName: com.cheecar.CatchMyTrain
            CFBundleURLSchemes: [catchmytrain]
    # The entitlements file is handwritten (not generated by XcodeGen):
    #   App/CatchMyTrain.entitlements: sandbox, network, location, and the folder shared with the widget
    #     (Library/Application Support/com.cheecar.CatchMyTrain in the home folder; see SharedFolder in TransitCore)
    # The widget's file names the same shared folder.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cheecar.CatchMyTrain
        # The app file is "Catch My Train.app" (shown in Finder and the Dock); the Swift module keeps the old name for @testable import
        PRODUCT_NAME: Catch My Train
        PRODUCT_MODULE_NAME: CatchMyTrain
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/CatchMyTrain.entitlements

  CatchMyTrainWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - package: CatchCore
        product: TransitCore
      - package: CatchCore
        product: CatchText
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Catch My Train Widget
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "278"
        AppGroupIdentifier: $(TeamIdentifierPrefix)com.cheecar.catchmytrain.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/CatchMyTrainWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # The widget downloads MTA realtime data itself (so it can update even when the main app is closed)
        com.apple.security.network.client: true
        # The folder shared with the app (the same one the app's entitlements name)
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/com.cheecar.CatchMyTrain/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cheecar.CatchMyTrain.Widget
        # The widget file and its process are named "Catch My Train Widget"; the Swift module keeps the old name
        PRODUCT_NAME: Catch My Train Widget
        PRODUCT_MODULE_NAME: CatchMyTrainWidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  CatchCoreTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Packages/CatchCore/Tests
    dependencies:
      - package: CatchCore
        product: TransitCore
      - package: CatchCore
        product: CatchText

  # App-level tests: launches the app once for testing (TEST_HOST), using @testable import CatchMyTrain
  CatchMyTrainAppTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cheecar.CatchMyTrainAppTests
        # The app file and executable are named "Catch My Train"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Catch My Train.app/Contents/MacOS/Catch My Train"
    sources:
      - path: AppTests
    dependencies:
      # Depends only on the app itself (CatchCore is already in the app; linking another copy in tests would duplicate the same types)
      - target: CatchMyTrain

schemes:
  CatchMyTrain:
    build:
      targets:
        CatchMyTrain: all
        CatchMyTrainWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CatchCoreTests
        - CatchMyTrainAppTests
  CatchMyTrainWidgetExtension:
    build:
      targets:
        CatchMyTrainWidgetExtension: all
        CatchMyTrain: all
    run:
      config: Debug
      askForAppToLaunch: true
      environmentVariables:
        _XCWidgetKind: CatchMyTrainWidget
        _XCWidgetFamily: medium
